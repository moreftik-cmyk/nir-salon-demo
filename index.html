  return `<div class="page-head"><div><div class="eyebrow">מרכז השיבוץ של ניר</div><h1>יומן עבודה שבועי</h1><p>ניר עובד רק בשלישי–חמישי. שאר הימים סגורים. פנייה עם כמה אפשרויות נשארת כבועה אחת; ניר בוחר אפשרות אחת ומשבץ אותה.</p></div><div class="calendar-actions"><div class="calendar-legend"><span>★ עדיפות</span><span>גרירה לשיבוץ</span></div><button class="btn ghost" onclick="setTab('leads')">חזרה לפניות</button></div></div><div class="dispatch-layout"><aside class="dispatch-pool"><div class="pool-head"><div><div class="eyebrow">פניות ממתינות</div><h2>טבלת תעדוף</h2></div><strong>${pending.length}</strong></div><p class="pool-hint">בדמו יש גם אפשרות אחת וגם שתי אפשרויות לאותו לקוח. גררי בועה ליומן או לחצי על אחת מאפשרויות הזמן. כמה בועות באותה משבצת הן התנגשות לתרגול.</p><div class="priority-list">${pending.map(l=>`<article class="priority-card" draggable="true" ondragstart="dragLead('${l.id}')"><div class="priority-card-name">${esc(l.name)}</div><div>${esc(l.service)} · ${rule(l.service).duration} דק׳</div><div class="priority-stars">${stars(l)}</div><small>${esc(l.slots)}</small><div class="slot-options">${(l.options||[]).map(o=>`<button class="slot-option" onclick="placeLeadOption('${l.id}','${o.day}','${o.slot}')">${o.label}</button>`).join("")}</div></article>`).join("")||`<div class="empty-state">אין כרגע פניות שממתינות לשיבוץ.</div>`}</div></aside><section class="calendar-card week-scroll"><div class="week-board"><div class="week-row week-head"><div class="time-col head-label">שעה</div>${days.map(d=>`<div class="day-head ${d.tone}"><b>${d.name}</b><span>${d.date}</span></div>`).join("")}</div>${slots.map(time=>`<div class="week-row"><div class="time-col">${time}</div>${days.map(d=>`<div class="day-cell" ondragover="event.preventDefault()" ondrop="dropOnCalendar('${d.key}','${time}')">${event(d,time)}</div>`).join("")}</div>`).join("")}</div></section></div><div class="calendar-foot-note">כרטיסים באותו תא מציגים התנגשות אפשרית לתרגול. פנייה עם שתי אפשרויות מופיעה פעם אחת בלבד בטבלת התיעדוף; רק האפשרות שניר בוחר הופכת לשיבוץ. לאחר האישור נוצרת הודעת WhatsApp עם היום והשעה שבחר.</div>`;
}
